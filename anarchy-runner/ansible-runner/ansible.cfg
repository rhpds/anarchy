[defaults]
# Use anarchy-runner tmp directory
local_tmp = /opt/app-root/anarchy-runner/.ansible/tmp
remote_tmp = /opt/app-root/anarchy-runner/.ansible/tmp
anarchy_output_dir = /opt/app-root/anarchy-runner/output
# Suppress deprecation warnings to prevent inflating AnarchyRun output
# stored in etcd. The vars. dict deprecation (ansible-core 2.24) is tracked
# for fix in babylon_anarchy_governor role.
deprecation_warnings = False
